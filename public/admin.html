<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenTutor — Students</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="app">
    <header>
      <h1><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z" /></svg>Students</h1>
      <div class="header-right">
        <a class="nav-btn" href="/learn.html">Back to lessons</a>
        <button id="theme-toggle" type="button">Dark theme</button>
      </div>
    </header>

    <main>
      <section class="view active">
        <form id="add-student" class="admin-add">
          <input id="new-id" type="text" placeholder="student id (e.g. alice)" autocomplete="off" required>
          <input id="new-name" type="text" placeholder="display name (optional)" autocomplete="off">
          <button type="submit">Add student</button>
        </form>
        <p id="add-error" class="admin-error" hidden></p>

        <div id="student-token" hidden role="status">
          <p>Give this access token to the student. It is shown only once; resetting it revokes the previous token.</p>
          <input id="student-token-value" type="text" readonly aria-label="Student access token">
        </div>

        <div id="students" class="admin-list" aria-live="polite">
          <p class="admin-empty">Loading…</p>
        </div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
