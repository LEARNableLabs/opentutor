<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenTutor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>OpenTutor</h1>
      <nav id="nav">
        <button class="nav-btn active" data-view="learn">Learn</button>
        <button class="nav-btn" data-view="topics">Topics</button>
        <button class="nav-btn" data-view="chat">Chat</button>
      </nav>
    </header>

    <main>
      <!-- Learn view -->
      <section id="view-learn" class="view active">
        <div id="topic-select">
          <select id="active-topic">
            <option value="">Select a topic...</option>
          </select>
          <button id="btn-next" class="primary">Next Lesson</button>
        </div>

        <div id="lesson-loading" class="hidden">
          <div class="spinner"></div>
          <span>Generating lesson...</span>
        </div>

        <div id="lesson-area" class="hidden">
          <div id="lesson-meta"></div>
          <div id="lesson-conversation"></div>
          <div id="lesson-input-area" class="hidden">
            <input type="text" id="lesson-input" placeholder="Your answer...">
            <button id="btn-lesson-answer" class="primary">Send</button>
          </div>
          <div id="lesson-complete" class="hidden">
            <p>Lesson complete. Type <strong>/next</strong> or click <strong>Next Lesson</strong> to continue.</p>
          </div>
        </div>

        <div id="empty-state">
          <p>Pick a topic and hit <strong>Next Lesson</strong> to start learning.</p>
          <p class="dim">Or go to <strong>Topics</strong> to browse all 292 available curricula.</p>
        </div>
      </section>

      <!-- Topics view -->
      <section id="view-topics" class="view hidden">
        <div id="topic-search">
          <input type="text" id="search-topics" placeholder="Search 292 topics...">
        </div>
        <div id="topic-list"></div>
        <div id="add-topic">
          <h3>Add a new topic</h3>
          <div id="add-topic-form">
            <input type="text" id="new-topic" placeholder="What do you want to learn?">
            <select id="new-level">
              <option value="beginner">Beginner</option>
              <option value="intermediate" selected>Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
            <button id="btn-add" class="primary">Add</button>
          </div>
        </div>
      </section>

      <!-- Chat view -->
      <section id="view-chat" class="view hidden">
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <input type="text" id="chat-input" placeholder="Ask me anything...">
          <button id="btn-send" class="primary">Send</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Onboarding overlay -->
  <div id="onboarding-overlay" class="hidden">
    <div id="onboarding-modal">
      <h2>Welcome to OpenTutor</h2>
      <div id="onboarding-chat"></div>
      <div id="onboarding-input-area">
        <input type="text" id="onboarding-input" placeholder="Type your answer...">
        <button id="btn-onboard-send" class="primary">Send</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
