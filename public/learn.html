<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your learning · OpenTutor</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preload" href="/fonts/eb-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>
          <a class="brand" href="/"
            ><img src="favicon.png" alt="" width="40" height="40" /><span>Open<span class="brand-accent">Tutor</span></span></a
          >
        </h1>
        <nav id="nav" aria-label="Sections">
          <button class="nav-btn active" data-view="learn">Learn</button>
          <button class="nav-btn" data-view="topics">Topics</button>
          <button class="nav-btn" data-view="chat">Chat</button>
        </nav>
      </header>

      <div id="connect-banner" class="hidden" role="status">
        <p id="connect-message"></p>
        <button id="btn-connect" type="button" class="primary">Connect OpenRouter</button>
        <button id="btn-connect-browse" type="button" class="secondary">Browse ready-made topics</button>
        <form id="key-form">
          <label for="key-input">Or paste an OpenRouter key</label>
          <input id="key-input" type="password" autocomplete="off" spellcheck="false" placeholder="sk-or-…" />
          <button id="btn-save-key" type="submit" class="secondary">Save key</button>
        </form>
      </div>

      <main>
        <!-- Learn view -->
        <section id="view-learn" class="view active">
          <div id="topic-select">
            <select id="active-topic" aria-label="Topic">
              <option value="">Select a topic...</option>
            </select>
            <button id="btn-next" class="primary">Next lesson</button>
          </div>

          <div id="topic-build-status" role="status"></div>
          <button id="btn-retry-build" type="button" class="secondary hidden">Retry curriculum build</button>
          <div id="lesson-loading" class="hidden">
            <div class="spinner"></div>
            <span>Preparing your lesson…</span>
          </div>

          <div id="lesson-area" class="hidden">
            <div id="lesson-meta"></div>
            <div id="lesson-conversation"></div>
            <div id="lesson-input-area" class="hidden">
              <input type="text" id="lesson-input" placeholder="Your answer" aria-label="Your answer" />
              <button id="btn-lesson-answer" class="primary">Send</button>
            </div>
          </div>

          <div id="empty-state">
            <p id="empty-title">What are you curious about today?</p>
            <p class="dim">
              Pick a topic above to start a lesson, or open <strong>Topics</strong> to browse
              ready-made courses.
            </p>
          </div>
        </section>

        <!-- Topics view -->
        <section id="view-topics" class="view">
          <div id="topic-search">
            <input type="text" id="search-topics" placeholder="Search topics" aria-label="Search topics" />
          </div>
          <div id="topic-list"></div>
          <p id="topic-error" role="alert"></p>
          <div id="add-topic">
            <h3>Add a topic</h3>
            <p>
              Choose a topic above, or name your own. You start with five lessons while the
              full course is prepared.
            </p>
            <div id="add-topic-form">
              <input type="text" id="new-topic" placeholder="What do you want to learn?" aria-label="New topic" />
              <select id="new-level" aria-label="Level">
                <option value="beginner">Beginner</option>
                <option value="intermediate" selected>Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
              <button id="btn-add" class="primary">Add</button>
            </div>
          </div>
        </section>

        <!-- Chat view -->
        <section id="view-chat" class="view">
          <div id="chat-messages"></div>
          <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask me anything" aria-label="Your message" />
            <button id="btn-send" class="primary">Send</button>
          </div>
        </section>
      </main>

      <!-- Account controls sit apart from the tabs, where a mis-tap on a phone costs nothing. -->
      <footer class="account-bar">
        <span id="key-status" class="hidden"></span>
        <div class="account-actions">
          <button id="btn-disconnect" type="button" class="hidden">Disconnect OpenRouter</button>
          <button id="btn-signout" type="button">Log out</button>
          <button id="btn-delete-account" type="button" class="hidden">Delete account</button>
          <button id="theme-toggle" type="button">Dark theme</button>
        </div>
      </footer>
    </div>

    <!-- Onboarding overlay -->
    <div id="onboarding-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="Getting started">
      <div id="onboarding-modal">
        <h2>Welcome to OpenTutor</h2>
        <div id="onboarding-chat"></div>
        <div id="onboarding-input-area">
          <input type="text" id="onboarding-input" placeholder="Type your answer" aria-label="Your answer" />
          <button id="btn-onboard-send" class="primary">Send</button>
        </div>
        <button id="btn-onboard-browse" type="button" class="secondary">Browse available topics</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
